name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: learning-site-editor }
      - uses: actions/checkout@v4
        with: { repository: galtauba/learning-site-engine, path: learning-site-engine }
      - uses: actions/checkout@v4
        with: { repository: galtauba/learning-site-themes, path: learning-site-themes }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-site-editor/package-lock.json
      - run: npm ci
        working-directory: learning-site-engine
      - run: npm run build
        working-directory: learning-site-engine
      - run: npm ci
        working-directory: learning-site-editor
      - run: npm run lint
        working-directory: learning-site-editor
      - run: npm test
        working-directory: learning-site-editor
      - run: npm run package
        working-directory: learning-site-editor
      - shell: pwsh
        working-directory: learning-site-editor
        run: Get-FileHash release\*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path)" } | Out-File release\checksums.txt
      - uses: softprops/action-gh-release@v2
        with: { files: "learning-site-editor/release/*.exe\nlearning-site-editor/release/*.blockmap\nlearning-site-editor/release/latest.yml\nlearning-site-editor/release/checksums.txt" }
